<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rival RP — обновление 1.2</title>
    <style>
        @font-face {
            font-family: "Benzin";
            src: url("Benzin Extra Bold.ttf") format("truetype");
            font-weight: 800;
        }

        @font-face {
            font-family: "Benzin";
            src: url("Benzin Medium.ttf") format("truetype");
            font-weight: 500;
        }

        :root { color-scheme: dark; }
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 39%, rgba(190,139,255,.07) 0, transparent 25%),
                repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
                #080808;
            color: #fff;
            font-family: "Benzin", Arial, sans-serif;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 28%, rgba(0,0,0,.72) 100%);
        }

        .language {
            position: fixed;
            z-index: 2;
            top: 22px;
            right: 22px;
            display: inline-flex;
            align-items: center;
            padding: 3px;
            border: 1px solid rgba(185,104,255,.22);
            border-radius: 20px;
            background: rgba(10,10,10,.72);
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
            backdrop-filter: blur(10px);
        }

        .language::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 42px;
            height: 30px;
            border-radius: 16px;
            background: #b968ff;
            box-shadow: 0 0 14px rgba(185,104,255,.38);
            transition: transform .45s cubic-bezier(.65, 0, .35, 1);
        }

        .language.ua::before {
            transform: translateX(42px);
        }

        .language button {
            position: relative;
            z-index: 1;
            width: 42px;
            height: 30px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            color: #777;
            cursor: pointer;
            font: 700 11px/30px Arial, sans-serif;
            letter-spacing: .08em;
            transition: color .25s ease;
        }

        .language button.active {
            color: #080808;
        }

        .temporary-site {
            position: fixed;
            z-index: 2;
            top: 22px;
            left: 22px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0 16px;
            border: 1px solid rgba(185,104,255,.22);
            border-radius: 20px;
            background: rgba(10,10,10,.72);
            color: #ddd;
            text-decoration: none;
            font: 700 11px/1 Arial, sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
            backdrop-filter: blur(10px);
            transition: border-color .25s, color .25s, box-shadow .25s, transform .25s;
        }

        .temporary-site::before {
            content: "";
            width: 6px;
            height: 6px;
            flex: none;
            border-radius: 50%;
            background: #b968ff;
            box-shadow: 0 0 11px rgba(185,104,255,.85);
        }

        .temporary-site:hover {
            border-color: rgba(185,104,255,.55);
            color: #fff;
            box-shadow: 0 8px 34px rgba(185,104,255,.12);
            transform: translateY(-2px);
        }

        main {
            position: relative;
            z-index: 1;
            width: min(560px, calc(100% - 32px));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icon-wrap {
            width: 86px;
            height: 86px;
            margin-top: clamp(58px, 17vh, 145px);
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(174,96,255,.18), transparent 62%),
                rgba(255,255,255,.018);
            box-shadow:
                inset 0 0 24px rgba(255,255,255,.025),
                0 18px 60px rgba(0,0,0,.7);
        }

        .power {
            width: 38px;
            height: 38px;
            color: #b968ff;
            filter: drop-shadow(0 0 9px rgba(185,104,255,.42));
        }

        h1 {
            margin: 46px 0 0;
            font-size: clamp(29px, 7.4vw, 48px);
            line-height: 1;
            letter-spacing: .045em;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
            text-shadow: 0 8px 28px rgba(255,255,255,.09);
        }

        .description {
            margin: 23px 0 0;
            color: #969696;
            font-family: Arial, sans-serif;
            font-size: clamp(13px, 2.5vw, 16px);
            line-height: 1.45;
        }

        .project {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 25px 0 0;
            color: #b968ff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
        }

        .project::before {
            content: "";
            width: 6px;
            height: 6px;
            flex: none;
            border-radius: 50%;
            background: #b968ff;
            box-shadow: 0 0 11px rgba(185,104,255,.85);
            animation: blink 1.5s ease-in-out infinite;
        }

        .thanks {
            margin: auto 0 28px;
            color: #4d4d4d;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: .02em;
        }

        @media (max-height: 590px) {
            .icon-wrap { margin-top: 34px; }
            h1 { margin-top: 28px; }
            .thanks { margin-bottom: 14px; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .power { animation: glow 2.4s ease-in-out infinite; }
            .icon-wrap { animation: breathe 2.4s ease-in-out infinite; }
        }

        @keyframes glow {
            50% { filter: drop-shadow(0 0 14px rgba(185,104,255,.58)); }
        }

        @keyframes breathe {
            50% {
                border-color: rgba(185,104,255,.4);
                box-shadow:
                    inset 0 0 28px rgba(185,104,255,.08),
                    0 0 28px rgba(185,104,255,.12);
                transform: scale(1.025);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: .15; transform: scale(.72); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <a class="temporary-site" href="https://idczxz228.github.io/RivalRp/" target="_blank" rel="noopener noreferrer">
        <span data-text="temporary">Временный сайт</span>
    </a>

    <div class="language" aria-label="Выбор языка">
        <button type="button" data-lang="ru" class="active">RU</button>
        <button type="button" data-lang="ua">UA</button>
    </div>

    <main>
        <div class="icon-wrap" aria-hidden="true">
            <svg class="power" viewBox="0 0 48 48" fill="none">
                <path d="M24 5V27" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
                <path d="M16.2 13.2C10.5 16.7 7.5 23 9.5 29.6C11.9 37.5 20.4 41.7 28.2 38.8C35.9 35.9 39.9 27.2 36.8 19.6C35.4 16.1 33 13.6 29.9 11.8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
            </svg>
        </div>

        <h1 data-text="title">ОБНОВЛЕНИЕ 1.2</h1>
        <p class="description" data-text="description">Сайт временно закрыт</p>
        <p class="project">RIVAL RP</p>
        <p class="thanks" data-text="thanks">Спасибо за понимание</p>
    </main>

    <script>
        const translations = {
            ru: {
                title: "ОБНОВЛЕНИЕ 1.2",
                description: "Сайт временно закрыт",
                thanks: "Спасибо за понимание",
                temporary: "Временный сайт"
            },
            ua: {
                title: "ОНОВЛЕННЯ 1.2",
                description: "Сайт тимчасово закрито",
                thanks: "Дякуємо за розуміння",
                temporary: "Тимчасовий сайт"
            }
        };

        const buttons = document.querySelectorAll("[data-lang]");

        function setLanguage(language) {
            document.documentElement.lang = language;
            document.querySelectorAll("[data-text]").forEach(element => {
                element.textContent = translations[language][element.dataset.text];
            });
            buttons.forEach(button => button.classList.toggle("active", button.dataset.lang === language));
            document.querySelector(".language").classList.toggle("ua", language === "ua");
            localStorage.setItem("rival-language", language);
        }

        buttons.forEach(button => {
            button.addEventListener("click", () => setLanguage(button.dataset.lang));
        });

        setLanguage(localStorage.getItem("rival-language") === "ua" ? "ua" : "ru");
    </script>
</body>
</html>
